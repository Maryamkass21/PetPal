name: Flutter CI

on:
  push:
    branches:
      - main
      - maryam_ci
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Run CI build script (tests)
        run: |
          chmod +x ci_build.sh
          ./ci_build.sh

